<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="880" viewBox="0 0 1760 880" font-family="Georgia, Cambria, serif"><rect width="1760" height="880" fill="#FFFFFF"/><text x="880.0" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3A5F">Cycle de vie d'une intervention — diagramme d'états-transitions</text><circle cx="110" cy="206" r="15" fill="#1F3A5F"/><path d="M128.0,206.0 L174.0,206.0" fill="none" stroke="#374151" stroke-width="2.4" stroke-linejoin="round"/><polygon points="187.0,206.0 171.1,212.0 171.1,200.0" fill="#374151"/><rect x="122.0" y="133" width="72.0" height="22" fill="#FFFFFF" opacity="0.97"/><text x="158" y="148" text-anchor="middle" font-size="14" font-style="italic" fill="#111827">création</text><rect x="190" y="170" width="210" height="72" rx="16" fill="#FFFFFF" stroke="#2E6DA4" stroke-width="2.6"/><text x="295.0" y="213.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#2E6DA4">NOUVELLE</text><rect x="470" y="170" width="210" height="72" rx="16" fill="#FFFFFF" stroke="#2E6DA4" stroke-width="2.6"/><text x="575.0" y="213.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#2E6DA4">AFFECTEE</text><rect x="750" y="170" width="210" height="72" rx="16" fill="#FFFFFF" stroke="#2E6DA4" stroke-width="2.6"/><text x="855.0" y="213.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#2E6DA4">ACCEPTEE</text><rect x="1030" y="170" width="210" height="72" rx="16" fill="#F2F7FC" stroke="#2E6DA4" stroke-width="2.6"/><text x="1135.0" y="213.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#2E6DA4">EN_COURS</text><rect x="1310" y="170" width="210" height="72" rx="16" fill="#F1F8F3" stroke="#166534" stroke-width="2.6"/><text x="1415.0" y="213.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#166534">TERMINEE</text><circle cx="1590" cy="206" r="17" fill="none" stroke="#1F3A5F" stroke-width="2.6"/><circle cx="1590" cy="206" r="10" fill="#1F3A5F"/><path d="M400.0,206.0 L454.0,206.0" fill="none" stroke="#374151" stroke-width="2.4" stroke-linejoin="round"/><polygon points="467.0,206.0 451.1,212.0 451.1,200.0" fill="#374151"/><rect x="355.75" y="111" width="158.5" height="22" fill="#FFFFFF" opacity="0.97"/><text x="435.0" y="126" text-anchor="middle" font-size="15" font-style="italic" fill="#111827">affecter( employé )</text><rect x="339.25" y="133" width="191.5" height="22" fill="#FFFFFF" opacity="0.97"/><text x="435.0" y="148" text-anchor="middle" font-size="13" font-style="italic" fill="#B45309">[ confirmée par le client ]</text><path d="M680.0,206.0 L734.0,206.0" fill="none" stroke="#374151" stroke-width="2.4" stroke-linejoin="round"/><polygon points="747.0,206.0 731.1,212.0 731.1,200.0" fill="#374151"/><rect x="665.75" y="133" width="98.5" height="22" fill="#FFFFFF" opacity="0.97"/><text x="715.0" y="148" text-anchor="middle" font-size="15" font-style="italic" fill="#111827">accepter( )</text><path d="M960.0,206.0 L1014.0,206.0" fill="none" stroke="#374151" stroke-width="2.4" stroke-linejoin="round"/><polygon points="1027.0,206.0 1011.1,212.0 1011.1,200.0" fill="#374151"/><rect x="945.75" y="133" width="98.5" height="22" fill="#FFFFFF" opacity="0.97"/><text x="995.0" y="148" text-anchor="middle" font-size="15" font-style="italic" fill="#111827">démarrer( )</text><path d="M1240.0,206.0 L1294.0,206.0" fill="none" stroke="#374151" stroke-width="2.4" stroke-linejoin="round"/><polygon points="1307.0,206.0 1291.1,212.0 1291.1,200.0" fill="#374151"/><rect x="1199.5" y="111" width="151.0" height="22" fill="#FFFFFF" opacity="0.97"/><text x="1275.0" y="126" text-anchor="middle" font-size="15" font-style="italic" fill="#111827">clôturer( rapport,</text><rect x="1222.0" y="133" width="106.0" height="22" fill="#FFFFFF" opacity="0.97"/><text x="1275.0" y="148" text-anchor="middle" font-size="15" font-style="italic" fill="#111827">prix final )</text><path d="M1520.0,206.0 L1557.0,206.0" fill="none" stroke="#374151" stroke-width="2.4" stroke-linejoin="round"/><polygon points="1570.0,206.0 1554.1,212.0 1554.1,200.0" fill="#374151"/><rect x="890" y="400" width="210" height="72" rx="16" fill="#FDF7EF" stroke="#B45309" stroke-width="2.6"/><text x="995.0" y="443.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#B45309">EN_ATTENTE</text><path d="M810.0,242.0 L943.2,388.4" fill="none" stroke="#B45309" stroke-width="2.4" stroke-linejoin="round"/><polygon points="952.0,398.0 936.9,390.3 945.7,382.2" fill="#B45309"/><rect x="670.25" y="319" width="143.5" height="22" fill="#FFFFFF" opacity="0.97"/><text x="742" y="334" text-anchor="middle" font-size="15" font-style="italic" fill="#B45309">mettre en attente</text><path d="M1045.0,242.0 L1045.0,385.0" fill="none" stroke="#B45309" stroke-width="2.4" stroke-linejoin="round"/><polygon points="1045.0,398.0 1039.0,382.1 1051.0,382.1" fill="#B45309"/><rect x="936.25" y="315" width="83.5" height="22" fill="#FFFFFF" opacity="0.97"/><text x="978" y="330" text-anchor="middle" font-size="15" font-style="italic" fill="#B45309">suspendre</text><path d="M1085.0,400.0 L1085.0,257.0" fill="none" stroke="#B45309" stroke-width="2.4" stroke-linejoin="round"/><polygon points="1085.0,244.0 1091.0,259.9 1079.0,259.9" fill="#B45309"/><rect x="1110.25" y="315" width="83.5" height="22" fill="#FFFFFF" opacity="0.97"/><text x="1152" y="330" text-anchor="middle" font-size="15" font-style="italic" fill="#B45309">reprendre</text><rect x="400" y="620" width="210" height="72" rx="16" fill="#FDF2F2" stroke="#B91C1C" stroke-width="2.6"/><text x="505.0" y="663.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#B91C1C">ANNULEE</text><circle cx="505" cy="770" r="17" fill="none" stroke="#1F3A5F" stroke-width="2.6"/><circle cx="505" cy="770" r="10" fill="#1F3A5F"/><path d="M505.0,692.0 L505.0,738.0" fill="none" stroke="#B91C1C" stroke-width="2.4" stroke-linejoin="round"/><polygon points="505.0,751.0 499.0,735.1 511.0,735.1" fill="#B91C1C"/><path d="M240.0,242.0 L437.8,606.6" fill="none" stroke="#B91C1C" stroke-width="2.4" stroke-linejoin="round"/><polygon points="444.0,618.0 431.1,606.9 441.7,601.2" fill="#B91C1C"/><path d="M530.0,242.0 L522.3,605.0" fill="none" stroke="#B91C1C" stroke-width="2.4" stroke-linejoin="round"/><polygon points="522.0,618.0 516.4,602.0 528.3,602.2" fill="#B91C1C"/><path d="M790.0,242.0 L617.3,626.1" fill="none" stroke="#B91C1C" stroke-width="2.4" stroke-linejoin="round"/><polygon points="612.0,638.0 613.1,621.0 624.0,625.9" fill="#B91C1C"/><path d="M920.0,472.0 L623.0,661.0" fill="none" stroke="#B91C1C" stroke-width="2.4" stroke-linejoin="round"/><polygon points="612.0,668.0 622.2,654.4 628.6,664.5" fill="#B91C1C"/><rect x="254.5" y="437" width="91.0" height="22" fill="#FFFFFF" opacity="0.97"/><text x="300" y="452" text-anchor="middle" font-size="15" font-style="italic" fill="#B91C1C">annuler( )</text><rect x="510.5" y="453" width="91.0" height="22" fill="#FFFFFF" opacity="0.97"/><text x="556" y="468" text-anchor="middle" font-size="15" font-style="italic" fill="#B91C1C">annuler( )</text><rect x="656.5" y="541" width="91.0" height="22" fill="#FFFFFF" opacity="0.97"/><text x="702" y="556" text-anchor="middle" font-size="15" font-style="italic" fill="#B91C1C">annuler( )</text><rect x="754.5" y="605" width="91.0" height="22" fill="#FFFFFF" opacity="0.97"/><text x="800" y="620" text-anchor="middle" font-size="15" font-style="italic" fill="#B91C1C">annuler( )</text><rect x="1210" y="490" width="480" height="200" rx="8" fill="#F8F9FB" stroke="#374151" stroke-width="1.4"/><text x="1230" y="522" font-size="17" font-weight="bold" fill="#1F3A5F">Règles de transition</text><text x="1230" y="552" font-size="15" fill="#111827">• Seules les transitions représentées sont autorisées ;</text><text x="1230" y="576" font-size="15" fill="#111827">  toute autre demande lève une exception métier.</text><text x="1230" y="600" font-size="15" fill="#111827">• Chaque changement d'état est historisé (traçabilité).</text><text x="1230" y="624" font-size="15" fill="#111827">• L'annulation est possible depuis NOUVELLE, AFFECTEE,</text><text x="1230" y="648" font-size="15" fill="#111827">  ACCEPTEE et EN_ATTENTE, mais jamais depuis EN_COURS.</text><text x="1230" y="672" font-size="15" fill="#111827">• TERMINEE et ANNULEE sont des états finaux.</text><rect x="90" y="540" width="250" height="150" rx="8" fill="#FFFFFF" stroke="#374151" stroke-width="1.3"/><text x="108" y="570" font-size="16" font-weight="bold" fill="#1F3A5F">Légende</text><circle cx="124" cy="598" r="11" fill="#1F3A5F"/><text x="148" y="603" font-size="14" fill="#111827">État initial</text><circle cx="124" cy="632" r="13" fill="none" stroke="#1F3A5F" stroke-width="2"/><circle cx="124" cy="632" r="7" fill="#1F3A5F"/><text x="148" y="637" font-size="14" fill="#111827">État final</text><path d="M108.0,666.0 L135.0,666.0" fill="none" stroke="#374151" stroke-width="2.4" stroke-linejoin="round"/><polygon points="148.0,666.0 132.1,672.0 132.1,660.0" fill="#374151"/><text x="164" y="671" font-size="14" fill="#111827">Transition / événement</text></svg>