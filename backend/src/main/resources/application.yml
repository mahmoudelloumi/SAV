# ============================================================
# Application SAV - Configuration unique (dev + prod via variables d'environnement)
# ============================================================

spring:
  config:
    # Secrets locaux (mots de passe, cle JWT) : fichier ignore par git
    import: optional:classpath:application-secrets.properties
  application:
    name: gestion-sav

  # --- Base de données PostgreSQL ---
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sav_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 30000

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Africa/Tunis
    open-in-view: false

  # --- Upload fichiers ---
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # --- Jackson (JSON) ---
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Africa/Tunis
    serialization:
      write-dates-as-timestamps: false

  # --- Mail (envoi d'e-mails) ---
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:mahmoud.elloumi@enis.tn}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# --- Serveur ---
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

# --- Documentation API (Swagger) ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# --- Propriétés personnalisées ---
application:
  jwt:
    secret: ${JWT_SECRET:change-me-in-application-secrets-properties}
    expiration: 86400000       # 24 heures en millisecondes
    refresh-expiration: 604800000  # 7 jours en millisecondes
  upload:
    directory: ${UPLOAD_DIR:./uploads}
    allowed-types: application/pdf,image/jpeg,image/png,image/gif,image/webp,image/heic,image/heif
    max-size: 10485760         # 10 Mo en octets
  mail:
    from: ${MAIL_FROM:mahmoud.elloumi@enis.tn}   # expéditeur du rapport de clôture (doit = compte Gmail)
  cors:
    # Origines autorisées à appeler l'API (séparées par des virgules).
    # Pour un accès depuis d'autres postes : http://IP_DU_SERVEUR:5173
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  chatbot:
    ollama-url: ${OLLAMA_URL:http://localhost:11434}   # API Ollama locale
    model: ${OLLAMA_MODEL:qwen2.5:3b}                  # qwen2.5:3b : léger et rapide (~4-6s), bon français avec accents corrects
    timeout-seconds: ${OLLAMA_TIMEOUT:120}

# --- Logging ---
logging:
  level:
    com.sav: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}
